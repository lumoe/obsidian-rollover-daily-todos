name: Build

on:
  - push
  - pull_request

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2
        with:
          version: 6.0.2
          run_install: true
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
